name: Release and Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v9.1.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        shell: pwsh
        run: |
          # Read version from module manifest
          $manifest = Import-PowerShellDataFile ./Corsinvest.ProxmoxVE.Api/Corsinvest.ProxmoxVE.Api.psd1
          $moduleVersion = $manifest.ModuleVersion
          Write-Host "Module version: $moduleVersion"

          # Get tag version
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tagVersion = "${{ github.event.inputs.tag }}".TrimStart('v')
          } else {
            $tagVersion = "${{ github.ref }}".Replace('refs/tags/v', '')
          }
          Write-Host "Tag version: $tagVersion"

          # Validate versions match
          if ($moduleVersion -ne $tagVersion) {
            Write-Host "ERROR: Version mismatch!"
            Write-Host "   Module version : $moduleVersion"
            Write-Host "   Git tag        : v$tagVersion"
            exit 1
          }

          Write-Host "Version validated: $moduleVersion"
          echo "version=$moduleVersion" >> $env:GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "CHANGELOG.md" ]; then
            exit 0
          fi

          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            exit 0
          fi

          # where to get it, as cv4vs-agents does: the release page carries no file to install
          GALLERY="https://www.powershellgallery.com/packages/Corsinvest.ProxmoxVE.Api/$VERSION"

          echo "✅ Changelog section found for $VERSION"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Install from the [PowerShell Gallery]($GALLERY): \`Install-Module -Name Corsinvest.ProxmoxVE.Api -RequiredVersion $VERSION\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "[PowerShell Gallery]($GALLERY) | [Documentation](https://corsinvest.github.io/cv4pve-api-powershell/) | [Website](https://www.corsinvest.it/cv4pve)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish module to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path ./Corsinvest.ProxmoxVE.Api -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
