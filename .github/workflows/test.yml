name: Test

on:
  push:
    branches: [ "master" ]
    paths: [ "Corsinvest.ProxmoxVE.Api/**", "tests/**", "build.ps1", ".github/workflows/test.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "Corsinvest.ProxmoxVE.Api/**", "tests/**", "build.ps1", ".github/workflows/test.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # offline tests of the hand-written functions (tests/Test-*.ps1): no cluster needed
      - name: Run tests
        shell: pwsh
        run: ./build.ps1 -Task Test
